<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Fire System Digital Twin Dashboard</title>
    <style>
        /* ==========================================================
           1. 设计令牌 Design Tokens
           ========================================================== */
        :root {
            /* —— 色彩系统 —— */
            --bg-base: #05070d;
            --text-1: rgba(255, 255, 255, 0.95);
            --text-2: rgba(255, 255, 255, 0.60);
            --text-3: rgba(255, 255, 255, 0.38);
            --accent-blue: #0A84FF;
            --accent-teal: #64D2FF;
            --accent-red: #FF453A;
            --accent-orange: #FF9F0A;
            --accent-green: #30D158;

            /* —— 字号阶梯 —— */
            --text-xs: 9px;
            --text-sm: 10px;
            --text-md: 11px;
            --text-lg: 12px;
            --text-xl: 14px;
            --text-2xl: 15px;
            --text-3xl: 20px;
            --text-stat: 24px;

            /* —— 间距阶梯 —— */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 11px;
            --space-lg: 14px;
            --space-xl: 17px;
            --space-2xl: 21px;

            /* —— 圆角阶梯 —— */
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            --radius-2xl: 28px;

            /* —— 动效令牌 —— */
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --dur-fast: 0.18s;
            --dur-base: 0.32s;
        }

        /* 浅色主题令牌覆盖 */
        body.light {
            --bg-base: #e9eef5;
            --text-1: rgba(18, 24, 38, 0.95);
            --text-2: rgba(18, 24, 38, 0.62);
            --text-3: rgba(18, 24, 38, 0.42);
            --accent-teal: #0A87B8;
        }

        /* ==========================================================
           2. 重置与基础
           ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang HK", "Microsoft YaHei", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button {
            border: none;
            background: none;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        body {
            background: radial-gradient(62% 58% at 50% 42%, #1e3a5f 0%, #0c1628 54%, var(--bg-base) 82%);
            color: var(--text-1);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.5s;
        }

        body.light {
            background: radial-gradient(circle at 50% 42%, #fbfdff 0%, var(--bg-base) 78%);
        }

        /* 银河星云底色：中心亮 · 四周暗（科技感聚光） */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(50% 44% at 50% 42%, rgba(30, 150, 255, 0.32), transparent 70%),
                radial-gradient(28% 22% at 60% 32%, rgba(120, 220, 255, 0.16), transparent 68%),
                radial-gradient(22% 18% at 38% 54%, rgba(10, 132, 255, 0.14), transparent 72%),
                radial-gradient(160% 140% at 50% 45%, transparent 46%, rgba(1, 4, 12, 0.86) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* 科技感呼吸光晕：中心亮度缓慢脉动，强化「中间亮 · 四周暗」 */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(46% 40% at 50% 42%, rgba(42, 160, 255, 0.20), transparent 72%);
            animation: center-glow 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes center-glow {
            0%, 100% { opacity: 0.55; transform: scale(1); }
            50%      { opacity: 1;    transform: scale(1.05); }
        }

        body.light::before {
            background:
                radial-gradient(54% 46% at 50% 40%, rgba(255, 255, 255, 0.42), transparent 68%),
                radial-gradient(30% 24% at 62% 30%, rgba(10, 132, 255, 0.06), transparent 70%),
                radial-gradient(150% 130% at 50% 45%, transparent 55%, rgba(24, 38, 64, 0.14) 100%);
        }
        body.light::after { opacity: 0.4; }

        /* 星空 Canvas */
        #starfield {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.6s;
        }

        body.light #starfield { opacity: 0.16; }

        /* ==========================================================
           3. 液态玻璃材质系统 Liquid Glass
           ========================================================== */
        .glass {
            position: relative;
            background: linear-gradient(150deg,
                rgba(255, 255, 255, 0.10) 0%,
                rgba(255, 255, 255, 0.045) 42%,
                rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border-radius: var(--radius-xl);
            box-shadow:
                0 24px 48px -20px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.14),
                inset 0 -1px 0 rgba(255, 255, 255, 0.03);
        }

        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(160deg,
                rgba(255, 255, 255, 0.42),
                rgba(255, 255, 255, 0.07) 32%,
                rgba(255, 255, 255, 0.04) 68%,
                rgba(255, 255, 255, 0.16));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            pointer-events: none;
            z-index: -1;
            opacity: 0.75;
            transition: opacity var(--dur-base) var(--ease-out);
        }

        .glass::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background:
                radial-gradient(140% 90% at 6% -12%, rgba(255, 255, 255, 0.10), transparent 46%),
                radial-gradient(110% 55% at 100% 0%, rgba(120, 180, 255, 0.05), transparent 42%);
            pointer-events: none;
            z-index: -1;
        }

        .glass.hoverable {
            transition: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
        }

        .glass.hoverable:hover {
            transform: translateY(-3px);
            box-shadow:
                0 32px 56px -20px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 rgba(255, 255, 255, 0.04);
        }

        .glass.hoverable:hover::before { opacity: 1; }

        .glass-inline {
            background: linear-gradient(150deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* —— 浅色主题玻璃 —— */
        body.light .glass {
            background: linear-gradient(150deg,
                rgba(255, 255, 255, 0.72) 0%,
                rgba(255, 255, 255, 0.38) 42%,
                rgba(255, 255, 255, 0.24) 100%);
            box-shadow:
                0 24px 48px -22px rgba(40, 60, 90, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.95),
                inset 0 -1px 0 rgba(255, 255, 255, 0.4);
        }

        body.light .glass::before {
            background: linear-gradient(160deg,
                rgba(255, 255, 255, 0.95),
                rgba(200, 215, 235, 0.45) 32%,
                rgba(170, 190, 220, 0.25) 68%,
                rgba(255, 255, 255, 0.85));
            opacity: 1;
        }

        body.light .glass::after {
            background:
                radial-gradient(140% 90% at 6% -12%, rgba(255, 255, 255, 0.9), transparent 46%),
                radial-gradient(110% 55% at 100% 0%, rgba(140, 190, 255, 0.25), transparent 42%);
        }

        body.light .glass.hoverable:hover {
            box-shadow:
                0 32px 56px -22px rgba(40, 60, 90, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }

        body.light .glass-inline {
            background: linear-gradient(150deg, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0.3));
            border-color: rgba(40, 60, 90, 0.12);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
        }

        /* ==========================================================
           4. 线性图标系统（Feather 风格）
           ========================================================== */
        .icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        .icon-14 { width: 14px; height: 14px; }
        .icon-16 { width: 16px; height: 16px; }
        .icon-18 { width: 18px; height: 18px; }

        .tone-red    { color: var(--accent-red);    background: rgba(255, 69, 58, 0.14);    box-shadow: 0 0 20px rgba(255, 69, 58, 0.12); }
        .tone-orange { color: var(--accent-orange); background: rgba(255, 159, 10, 0.14);   box-shadow: 0 0 20px rgba(255, 159, 10, 0.12); }
        .tone-blue   { color: var(--accent-blue);   background: rgba(10, 132, 255, 0.14);   box-shadow: 0 0 20px rgba(10, 132, 255, 0.12); }
        .tone-green  { color: var(--accent-green);  background: rgba(48, 209, 88, 0.14); }

        /* ==========================================================
           5. 主网格布局（自适应）
           ========================================================== */
        .app-container {
            position: relative;
            z-index: 1;
            width: 94vw;
            height: 89vh;
            display: grid;
            grid-template-columns: 76px minmax(0, 1fr) clamp(258px, 22vw, 320px);
            grid-template-rows: 60px minmax(0, 1fr) clamp(180px, 22vh, 212px);
            gap: var(--space-lg);
        }

        /* ==========================================================
           6. 左侧导航
           ========================================================== */
        .sidebar {
            grid-row: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--space-xl) 0;
            gap: var(--space-md);
            border-radius: var(--radius-2xl);
            overflow-y: auto;
        }

        .nav-item {
            width: 56px;
            padding: var(--space-xs) 0;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-3);
            transition: all var(--dur-fast) var(--ease-out);
        }

        .nav-item:hover {
            color: var(--text-1);
            background: rgba(255, 255, 255, 0.06);
        }

        .nav-item.active {
            color: var(--text-1);
            background: linear-gradient(150deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.05));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                0 6px 18px rgba(0, 0, 0, 0.32);
        }

        body.light .nav-item:hover { background: rgba(30, 60, 110, 0.08); }

        body.light .nav-item.active {
            background: linear-gradient(150deg, rgba(255, 255, 255, 0.95), rgba(240, 246, 253, 0.6));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                0 6px 18px rgba(40, 60, 90, 0.15);
            color: rgba(18, 24, 38, 0.95);
        }

        .nav-label { font-size: var(--text-xs); letter-spacing: 0.02em; }

        .nav-divider {
            width: 24px;
            height: 1px;
            margin: var(--space-sm) 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
        }

        body.light .nav-divider {
            background: linear-gradient(90deg, transparent, rgba(40, 60, 90, 0.25), transparent);
        }

        /* ==========================================================
           7. 顶部控制栏 + 用户下拉
           ========================================================== */
        .top-header {
            grid-column: 2 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 var(--space-2xl);
            border-radius: var(--radius-lg);
            gap: var(--space-lg);
            min-width: 0;
            z-index: 300; /* 始终高于中央地图等后续模块，保证下拉菜单不被遮挡 */
        }

        .brand { display: flex; align-items: center; gap: var(--space-md); min-width: 0; }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-blue);
            background: linear-gradient(150deg, rgba(10, 132, 255, 0.22), rgba(10, 132, 255, 0.06));
            border: 1px solid rgba(10, 132, 255, 0.25);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 0 24px rgba(10, 132, 255, 0.18);
            flex-shrink: 0;
        }

        .title-area { min-width: 0; }

        .title-row { display: flex; align-items: center; gap: var(--space-md); }

        .title-area h1 {
            font-size: var(--text-3xl);
            font-weight: 650;
            letter-spacing: 0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: linear-gradient(180deg, #ffffff, rgba(255, 255, 255, 0.68));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.light .title-area h1 {
            background: linear-gradient(180deg, #16202f, rgba(22, 32, 47, 0.75));
            -webkit-background-clip: text;
        }

        /* 当前数据源标记 */
        .project-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--accent-teal);
            background: rgba(100, 210, 255, 0.1);
            border: 1px solid rgba(100, 210, 255, 0.25);
            white-space: nowrap;
        }

        body.light .project-pill {
            background: rgba(10, 135, 184, 0.08);
            border-color: rgba(10, 135, 184, 0.3);
        }

        .title-area p {
            font-size: var(--text-md);
            color: var(--text-3);
            margin-top: 2px;
            letter-spacing: 0.04em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions { display: flex; align-items: center; gap: var(--space-sm); flex-shrink: 0; }

        .btn-action {
            height: 34px;
            padding: 0 var(--space-md);
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-2);
            font-size: var(--text-md);
            transition: all var(--dur-fast) var(--ease-out);
            white-space: nowrap;
        }

        .btn-action:hover {
            color: var(--text-1);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
        }

        body.light .btn-action:hover { background: rgba(30, 60, 110, 0.08); box-shadow: none; }

        /* —— 用户信息下拉 —— */
        .user-wrap { position: relative; }

        .user-btn {
            height: 38px;
            padding: 0 var(--space-sm) 0 4px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            color: var(--text-2);
            transition: all var(--dur-fast) var(--ease-out);
        }

        .user-btn:hover, .user-btn.open { color: var(--text-1); background: rgba(255, 255, 255, 0.1); }
        body.light .user-btn:hover, body.light .user-btn.open { background: rgba(30, 60, 110, 0.08); }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-xs);
            font-weight: 700;
            color: #fff;
            background: linear-gradient(150deg, #0A84FF, #64D2FF);
            box-shadow: 0 0 14px rgba(10, 132, 255, 0.4);
        }

        .user-name { font-size: var(--text-md); font-weight: 600; }

        .user-btn .icon-14 { transition: transform var(--dur-base) var(--ease-out); }
        .user-btn.open .icon-14 { transform: rotate(180deg); }

        .user-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: 220px;
            padding: var(--space-xs);
            border-radius: var(--radius-md);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px) scale(0.97);
            transform-origin: top right;
            transition: all var(--dur-fast) var(--ease-out);
            z-index: 9990; /* 下拉菜单在页面最上方图层 */
        }

        .user-menu.open {
            opacity: 1;
            background: #000;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .menu-head {
            padding: var(--space-md);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: var(--space-xs);
        }

        body.light .menu-head { border-color: rgba(40, 60, 90, 0.12); }

        .menu-head h5 { font-size: var(--text-lg); font-weight: 600; }
        .menu-head p { font-size: var(--text-xs); color: var(--text-3); margin-top: 2px; }

        .menu-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: var(--space-md);
            padding: 9px var(--space-md);
            border-radius: var(--radius-sm);
            font-size: var(--text-lg);
            color: var(--text-2);
            transition: all var(--dur-fast) var(--ease-out);
            text-align: left;
        }

        .menu-item:hover { color: var(--text-1); background: rgba(255, 255, 255, 0.08); }
        body.light .menu-item:hover { background: rgba(30, 60, 110, 0.08); }
        .menu-item.danger { color: var(--accent-red); }
        .menu-item.danger:hover { background: rgba(255, 69, 58, 0.12); }

        .menu-divider {
            height: 1px;
            margin: var(--space-xs) var(--space-sm);
            background: rgba(255, 255, 255, 0.08);
        }

        body.light .menu-divider { background: rgba(40, 60, 90, 0.12); }

        /* ==========================================================
           8. 中央 GIS 数字孪生区
           ========================================================== */
        .main-gis {
            grid-column: 2;
            grid-row: 2;
            position: relative;
            border-radius: var(--radius-2xl);
            overflow: hidden;
            min-width: 0;
            min-height: 0;
        }

        .gis-grid {
            position: absolute;
            inset: 0;
            pointer-events: none; /* 网格仅作科技感叠加层，不拦截地图交互 */
            background:
                linear-gradient(rgba(10, 132, 255, 0.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 132, 255, 0.055) 1px, transparent 1px);
            background-size: 48px 48px;
            -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 45%, #000 30%, transparent 78%);
                    mask-image: radial-gradient(ellipse 75% 70% at 50% 45%, #000 30%, transparent 78%);
        }

        body.light .gis-grid {
            background:
                linear-gradient(rgba(10, 100, 210, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 100, 210, 0.12) 1px, transparent 1px);
        }

        .gis-horizon {
            position: absolute;
            left: 0; right: 0; top: 58%;
            height: 1px;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(100, 210, 255, 0.35), transparent);
        }

        .gis-content {
            position: relative;
            z-index: 1;
            padding: var(--space-2xl);
            height: 100%;
            min-height: 0;
            pointer-events: none; /* 内容层不拦截地图点击，打点/平移缩放交互可达 */
        }
        .gis-content > * { pointer-events: auto; } /* 面板等实际控件恢复交互 */

        /* 高德地图背景层（香港区域） */
        .amap-wrap {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .amap-wrap #amapContainer { width: 100%; height: 100%; }

        /* 地图上缘/下缘渐隐，与玻璃面板融合 */
        .amap-wrap::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(6, 12, 24, 0.32) 0%, transparent 18%, transparent 82%, rgba(6, 12, 24, 0.38) 100%);
        }
        body.light .amap-wrap::after {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.30) 0%, transparent 18%, transparent 82%, rgba(255, 255, 255, 0.36) 100%);
        }

        /* 主题色罩层：以品牌蓝 #0A84FF / 青蓝 #64D2FF 统一地图色调（低饱和 · 克制） */
        .amap-tint {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(120% 92% at 50% 42%, rgba(10, 132, 255, 0.16), rgba(5, 8, 16, 0.04) 90%),
                linear-gradient(200deg, rgba(100, 210, 255, 0.10), transparent 55%);
            mix-blend-mode: soft-light;
        }
        /* 深色主题四角微收暗，与全局「中间亮 · 四周暗」背景统一 */
        .amap-tint::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(130% 110% at 50% 45%, transparent 62%, rgba(3, 8, 18, 0.22) 100%);
        }
        /* 香港海岸轮廓提亮：中心青蓝光聚拢，突出陆地/水域边界 */
        body:not(.light) .amap-tint::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(58% 52% at 50% 46%, rgba(100, 210, 255, 0.12), transparent 70%),
                radial-gradient(90% 80% at 50% 45%, transparent 58%, rgba(2, 7, 18, 0.16) 100%);
        }
        body.light .amap-tint { background: radial-gradient(120% 90% at 50% 40%, rgba(10, 132, 255, 0.05), transparent 80%); mix-blend-mode: normal; }
        body.light .amap-tint::before, body.light .amap-tint::after { display: none; }

        /* 深色主题地图：轻微冷色偏移 + 低饱和，融入主题深蓝底，而非高饱和抢眼 */
        body:not(.light) .amap-wrap #amapContainer {
            filter: saturate(1.05) brightness(1.08) contrast(1.07) hue-rotate(-8deg);
        }

        .amap-wrap .amap-logo, .amap-wrap .amap-copyright { opacity: 0.55; }

        /* 高德地图项目打点（高德 pin 风格 · 点击切换项目） */
        .ap-pin {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.3s, filter 0.3s;
        }
        .ap-head {
            position: relative;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ap-dot {
            position: relative;
            width: 15px;
            height: 15px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            background: linear-gradient(135deg, #64D2FF, #0A84FF);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 12px rgba(10, 132, 255, 0.65), inset 0 1px 2px rgba(255, 255, 255, 0.5);
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .ap-dot::after {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: #fff;
            transform: translate(-50%, -50%);
        }
        .ap-ping {
            position: absolute;
            left: 50%; top: 50%;
            width: 20px; height: 20px;
            border-radius: 50%;
            border: 1.5px solid rgba(100, 210, 255, 0.8);
            transform: translate(-50%, -50%);
            animation: ap-ping 2.4s var(--ease-out) infinite;
            pointer-events: none;
        }
        .ap-name {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: rgba(255, 255, 255, 0.88);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8), 0 0 10px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
            padding: 1px 7px;
            border-radius: 999px;
            background: rgba(8, 14, 26, 0.55);
            border: 1px solid rgba(100, 210, 255, 0.22);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        body.light .ap-name {
            color: rgba(16, 26, 46, 0.92);
            background: rgba(255, 255, 255, 0.6);
            border-color: rgba(10, 132, 255, 0.25);
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.7);
        }
        .ap-pin:hover { filter: drop-shadow(0 0 10px rgba(100, 210, 255, 0.9)); }
        .ap-pin.dim { opacity: 0.32; }
        .ap-pin.active .ap-dot {
            box-shadow: 0 0 18px rgba(100, 210, 255, 1), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            transform: rotate(-45deg) scale(1.22);
        }
        .ap-pin.active .ap-name {
            color: #fff;
            border-color: rgba(100, 210, 255, 0.65);
            background: rgba(10, 132, 255, 0.32);
        }
        body.light .ap-pin.active .ap-name { color: #0a2540; background: rgba(100, 200, 255, 0.3); }

        @keyframes ap-ping {
            0%   { transform: translate(-50%, -50%) scale(0.55); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; }
        }

        /* pin 点击信息窗（自定义玻璃卡片 · isCustom 模式） */
        .ap-info {
            min-width: 208px;
            padding: 12px 14px;
            border-radius: 14px;
            background: linear-gradient(160deg, rgba(16, 26, 48, 0.92), rgba(8, 14, 28, 0.90));
            border: 1px solid rgba(100, 210, 255, 0.35);
            box-shadow: 0 18px 40px -14px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: rgba(255, 255, 255, 0.92);
            font-size: 12px;
        }
        body.light .ap-info {
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.95), rgba(245, 249, 255, 0.94));
            border-color: rgba(10, 132, 255, 0.28);
            box-shadow: 0 18px 36px -14px rgba(20, 40, 80, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            color: rgba(18, 28, 48, 0.92);
        }

        .ap-info-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 14px;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(100, 210, 255, 0.18);
        }
        .ap-info-head b { font-size: 14px; font-weight: 700; letter-spacing: 0.02em; }
        .ap-info-head .hp { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .ap-info-head .hp.ok { color: var(--accent-green); text-shadow: 0 0 12px rgba(48, 209, 88, 0.5); }
        .ap-info-head .hp.warn { color: var(--accent-orange); text-shadow: 0 0 12px rgba(255, 159, 10, 0.5); }
        .ap-info-head .hp small { font-size: 10px; color: var(--text-3); margin-left: 2px; }

        .ap-info .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2.5px 0;
            color: var(--text-2);
        }
        .ap-info .row b { color: var(--text-1); font-weight: 600; font-variant-numeric: tabular-nums; }
        .ap-info .row b.g { color: var(--accent-green); }
        .ap-info .row b.r { color: var(--accent-red); }

        .ap-info-foot {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed rgba(100, 210, 255, 0.16);
            font-size: 10.5px;
            color: var(--text-3);
            letter-spacing: 0.02em;
        }

        /* 健康度进度条 */
        .ap-info .health-bar {
            height: 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.10);
            overflow: hidden;
            margin: 3px 0 8px;
        }
        .ap-info .health-bar i {
            display: block;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #30D158, #64D2FF);
            box-shadow: 0 0 8px rgba(48, 209, 88, 0.55);
            transition: width 0.45s var(--ease-out);
        }
        .ap-info .health-bar i.warn {
            background: linear-gradient(90deg, #FF9F0A, #FF453A);
            box-shadow: 0 0 8px rgba(255, 159, 10, 0.55);
        }

        /* 信息窗分组标题（如「设备在线情况」） */
        .ap-info .sec-label {
            margin: 6px 0 2px;
            padding-top: 6px;
            border-top: 1px solid rgba(100, 210, 255, 0.14);
            font-size: 10px;
            letter-spacing: 0.1em;
            color: var(--text-3);
        }
        .ap-info .row .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: 1px;
        }

        /* ==========================================================
           8.5 点位信息固定面板（右侧 · 完整呈现不遮挡地图）
           ========================================================== */
        .gis-info-panel {
            position: absolute;
            top: var(--space-lg);
            right: var(--space-lg);
            width: 252px;
            max-height: calc(100% - var(--space-lg) * 2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: var(--radius-md);
            padding: 0;
            opacity: 0;
            transform: translateX(18px);
            pointer-events: none;
            transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
        }
        .gis-info-panel.show {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .gis-info-panel .ip-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px 10px;
            border-bottom: 1px solid rgba(100, 210, 255, 0.16);
            flex-shrink: 0;
        }
        body.light .gis-info-panel .ip-head { border-color: rgba(10, 132, 255, 0.18); }

        .gis-info-panel .ip-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 650;
            letter-spacing: 0.05em;
            color: var(--text-1);
        }
        .gis-info-panel .ip-close {
            width: 24px;
            height: 24px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-3);
            transition: all var(--dur-fast) var(--ease-out);
        }
        .gis-info-panel .ip-close:hover { color: var(--text-1); background: rgba(255, 255, 255, 0.1); }
        body.light .gis-info-panel .ip-close:hover { background: rgba(30, 60, 110, 0.08); }

        .gis-info-panel .ip-body {
            padding: 12px 14px 14px;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }
        /* 复用 .ap-info 内部行样式，但去掉其自带卡片背景，改用面板玻璃底 */
        .gis-info-panel .ip-body .ap-info {
            min-width: 0;
            padding: 0;
            background: none;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        /* ==========================================================
           9. 设备总览迷你浮窗（纯数据）
           ========================================================== */
        .device-overview {
            position: absolute;
            top: var(--space-lg);
            left: var(--space-lg);
            width: 208px;
            padding: var(--space-md);
            border-radius: var(--radius-md);
        }

        .ov-head {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: var(--text-md);
            font-weight: 600;
            color: var(--text-2);
            letter-spacing: 0.05em;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        body.light .ov-head { border-color: rgba(40, 60, 90, 0.12); }

        .ov-head .icon { width: 14px; height: 14px; color: var(--accent-blue); }

        .ov-stat {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-top: 9px;
        }

        .ov-stat .s-label { font-size: var(--text-md); color: var(--text-3); }
        .ov-stat .s-value {
            font-size: var(--text-2xl);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.01em;
        }

        .color-green { color: var(--accent-green); }
        .color-red   { color: var(--accent-red); }

        /* ==========================================================
           10. 项目列表
           ========================================================== */
        .project-list {
            width: 236px;
            padding: 6px;
            border-radius: var(--radius-md);
        }

        .pl-head {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 0;
            font-size: var(--text-md);
            font-weight: 700;
            letter-spacing: 0.14em;
            color: var(--text-3);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 12px;
        }

        .pl-head .icon { width: 12px; height: 12px; }

        .pl-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: var(--radius-sm);
            color: var(--text-2);
            font-size: var(--text-lg);
            transition: all var(--dur-fast) var(--ease-out);
            text-align: left;
        }

        .pl-item .icon-16 { color: var(--text-3); transition: color var(--dur-fast); }

        .pl-item:hover { color: var(--text-1); background: rgba(255, 255, 255, 0.07); }
        body.light .pl-item:hover { background: rgba(30, 60, 110, 0.08); }

        .pl-item.active {
            color: #fff;
            background: linear-gradient(150deg, rgba(10, 132, 255, 0.88), rgba(100, 210, 255, 0.55));
            box-shadow: 0 4px 14px rgba(10, 132, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .pl-item.active .icon-16 { color: rgba(255, 255, 255, 0.9); }
        .pl-item.active:hover { color: #fff; }

        .pl-name { flex: 1; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .pl-count {
            font-size: var(--text-sm);
            color: var(--text-3);
            font-variant-numeric: tabular-nums;
        }

        .pl-item.active .pl-count { color: rgba(255, 255, 255, 0.85); }

        /* ==========================================================
           11. 底部图表区（三张趋势图）
           ========================================================== */
        .bottom-charts {
            grid-column: 2;
            grid-row: 3;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: var(--space-lg);
            min-height: 0;
        }

        .chart-card {
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            border-radius: var(--radius-lg);
        }

        .chart-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-sm);
            min-height: 26px;
        }

        .chart-title {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: var(--text-lg);
            font-weight: 600;
            white-space: nowrap;
        }

        .chart-body {
            flex: 1;
            min-height: 0;
            position: relative;
        }

        .chart-body > div { width: 100%; height: 100%; }

        /* 饼图模块：图居左 · 状态信息归纳右侧 */
        .pie-body { display: flex; align-items: stretch; gap: var(--space-sm); }
        .pie-body > div { width: auto; }
        .pie-body #chartPie { flex: 1 1 56%; min-width: 0; }

        .pie-legend {
            flex: 0 0 44%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            padding-right: 2px;
        }

        .lg-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 3px 0;
            background: transparent;
            border: none;
            font: inherit;
            font-size: var(--text-sm);
            color: var(--text-2);
            cursor: pointer;
            transition: color .2s, opacity .25s;
        }
        .lg-row:hover, .lg-row.hl { color: var(--text-1); }
        .lg-row.hl .lg-dot { transform: scale(1.35); }
        .lg-row.dimmed { opacity: .38; }
        .lg-row.dimmed .lg-dot { background: var(--text-3) !important; }

        .lg-dot { width: 8px; height: 8px; border-radius: 3px; flex-shrink: 0; transition: background .25s, transform .2s; }
        .lg-name { flex: 1; text-align: left; white-space: nowrap; }
        .lg-val { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.3; }
        .lg-val b { color: var(--text-1); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
        
        /* 周期切换 tabs */
        .range-tabs {
            display: flex;
            gap: 2px;
            padding: 3px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        body.light .range-tabs {
            background: rgba(30, 60, 110, 0.05);
            border-color: rgba(40, 60, 90, 0.12);
        }

        .tab-btn {
            padding: 3px 10px;
            border-radius: 999px;
            font-size: var(--text-xs);
            font-weight: 600;
            color: var(--text-3);
            transition: all var(--dur-fast) var(--ease-out);
        }

        .tab-btn:hover { color: var(--text-1); }
        .tab-btn.active { color: #fff; background: rgba(10, 132, 255, 0.75); }

        /* ==========================================================
           12. 右侧信息面板
           ========================================================== */
        .side-panel {
            grid-column: 3;
            grid-row: 2 / -1;
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
            min-height: 0;
        }

        .info-card {
            flex: 1;
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-radius: var(--radius-lg);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-md);
            gap: var(--space-sm);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: var(--text-xl);
            font-weight: 600;
            color: var(--text-1);
        }

        .badge {
            padding: 3px 10px;
            border-radius: 999px;
            font-size: var(--text-xs);
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--accent-red);
            background: rgba(255, 69, 58, 0.16);
            border: 1px solid rgba(255, 69, 58, 0.25);
            flex-shrink: 0;
        }

        .badge.neutral {
            color: var(--text-2);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.light .badge.neutral {
            background: rgba(30, 60, 110, 0.06);
            border-color: rgba(40, 60, 90, 0.14);
        }

        .scroll-area {
            overflow-y: auto;
            flex: 1;
            min-height: 0;
            padding-right: var(--space-xs);
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: var(--space-md);
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--dur-fast) var(--ease-out);
            animation: fadeUp 0.4s var(--ease-out) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .list-item:hover {
            border-color: rgba(255, 255, 255, 0.16);
            transform: translateX(-4px);
        }

        body.light .list-item:hover { border-color: rgba(40, 60, 90, 0.2); }

        .item-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: var(--space-md);
            flex-shrink: 0;
        }

        .item-content { flex: 1; min-width: 0; }

        .item-content h4 {
            font-size: var(--text-lg);
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-content p {
            font-size: var(--text-sm);
            color: var(--text-3);
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-chevron { color: var(--text-3); }

        /* ==========================================================
           13. Toast 通知
           ========================================================== */
        #toastBox {
            position: fixed;
            top: var(--space-xl);
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            align-items: center;
            pointer-events: none;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            padding: 10px var(--space-lg);
            border-radius: 999px;
            font-size: var(--text-lg);
            color: var(--text-1);
            background: rgba(15, 20, 28, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            animation: toastIn 0.3s var(--ease-out) both;
        }

        body.light .toast {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(40, 60, 90, 0.14);
            box-shadow: 0 12px 32px rgba(40, 60, 90, 0.18);
        }

        .toast.out { animation: toastOut 0.3s var(--ease-out) both; }

        .toast .t-icon { display: flex; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-14px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to   { opacity: 0; transform: translateY(-10px) scale(0.96); }
        }

        /* ==========================================================
           14. 无障碍与滚动条
           ========================================================== */
        :focus-visible {
            outline: 2px solid var(--accent-blue);
            outline-offset: 2px;
            border-radius: var(--radius-sm);
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 999px; }
        body.light ::-webkit-scrollbar-thumb { background: rgba(40, 60, 90, 0.22); }

        /* ==========================================================
           15. 响应式（多断点自适应）
           ========================================================== */
        @media (max-width: 1440px) {
            .app-container {
                grid-template-columns: 84px minmax(0, 1fr) clamp(260px, 22vw, 310px);
            }
            .user-name { display: none; }
        }

        @media (max-width: 1200px) {
            body { overflow: auto; align-items: flex-start; }
            .app-container {
                grid-template-columns: 84px minmax(0, 1fr);
                grid-template-rows: 68px minmax(520px, 62vh) auto auto auto;
                height: auto;
                min-height: 92vh;
                padding: var(--space-lg) 0;
            }
            /* 中屏改文档流布局，消除绝对定位重叠 */
            .gis-content { display: flex; flex-direction: column; gap: var(--space-lg); }
            .device-overview { position: static; width: 100%; }
            .project-list { width: 100%; }
            .side-panel { grid-column: 2; grid-row: 4; flex-direction: row; }
            .side-panel .info-card { min-height: 260px; }
            .bottom-charts { grid-column: 2; grid-row: 3; grid-template-columns: 1fr; }
            .bottom-charts .chart-card { min-height: 230px; }
            .main-gis { grid-column: 2; grid-row: 2; }
        }

    /* ==============================================================

       ============================================================== */
    const $  = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];

    // 确定性伪随机（保证 30D 数据每次生成一致）
    function lcg(seed) {
        let s = seed;
        return () => (s = (s * 9301 + 49297) % 233280) / 233280;
    }

    function genSeries(n, base, amp, seed) {
        const rand = lcg(seed);
        return Array.from({ length: n }, (_, i) =>
            +(base + Math.sin(i / 3.2) * amp * 0.5 + (rand() - 0.5) * amp).toFixed(1)
        );
    }

    /* ==============================================================
       银河星空背景（Canvas 粒子系统）
       ============================================================== */
    class Starfield {
        constructor(canvas) {
            this.cv = canvas;
            this.ctx = canvas.getContext('2d');
            this.stars = [];
            this.meteors = [];
            this.running = true;
            this.resize();
            window.addEventListener('resize', () => this.resize());
            this.spawn();
            requestAnimationFrame(() => this.tick());
        }

        resize() {
            this.w = this.cv.width = innerWidth;
            this.h = this.cv.height = innerHeight;
        }

        spawn() {
            const n = Math.min(160, Math.floor(this.w * this.h / 12000));
            this.stars = Array.from({ length: n }, () => ({
                x: Math.random() * this.w,
                y: Math.random() * this.h,
                r: Math.random() * 1.4 + 0.3,
                base: Math.random() * 0.5 + 0.25,
                amp: Math.random() * 0.35,
                spd: Math.random() * 0.02 + 0.005,
                ph: Math.random() * Math.PI * 2,
                hue: [210, 190, 265, 0][Math.floor(Math.random() * 20) % 4]
            }));
        }

        tick() {
            if (!this.running) { requestAnimationFrame(() => this.tick()); return; }
            const { ctx, w, h } = this;
            ctx.clearRect(0, 0, w, h);
            const time = performance.now();

            // 星链连线
            ctx.lineWidth = 0.5;
            for (let i = 0; i < this.stars.length; i++) {
                const a = this.stars[i];
                for (let j = i + 1; j < this.stars.length; j++) {
                    const b = this.stars[j];
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < 110 * 110) {
                        const alpha = (1 - Math.sqrt(d2) / 110) * 0.08;
                        ctx.strokeStyle = `rgba(100, 180, 255, ${alpha})`;
                        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                    }
                }
            }

            // 星点闪烁
            for (const s of this.stars) {
                const tw = s.base + Math.sin(time * s.spd + s.ph) * s.amp;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = s.hue === 0
                    ? `rgba(255,255,255,${tw})`
                    : `hsla(${s.hue}, 80%, 75%, ${tw})`;
                ctx.fill();
            }

            // 流星
            if (Math.random() < 0.006 && this.meteors.length < 2) {
                this.meteors.push({
                    x: Math.random() * this.w * 0.7 + this.w * 0.3,
                    y: Math.random() * this.h * 0.3,
                    vx: -(Math.random() * 4 + 5),
                    vy: Math.random() * 2 + 2,
                    life: 1
                });
            }
            for (let m of this.meteors) {
                m.x += m.vx; m.y += m.vy; m.life -= 0.02;
                const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 8, m.y - m.vy * 8);
                grad.addColorStop(0, `rgba(180, 220, 255, ${m.life * 0.9})`);
                grad.addColorStop(1, 'rgba(180, 220, 255, 0)');
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(m.x - m.vx * 8, m.y - m.vy * 8);
                ctx.stroke();
            }
            this.meteors = this.meteors.filter(m => m.life > 0);

            requestAnimationFrame(() => this.tick());
        }
    }

    /* ==============================================================

    function toast(msg, type = 'info') {
        const icons = { info: ['i-info', 'var(--accent-blue)'], ok: ['i-check', 'var(--accent-green)'],
                        warn: ['i-alert', 'var(--accent-orange)'], alert: ['i-alert', 'var(--accent-red)'] };
        const [icon, color] = icons[type] || icons.info;
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerHTML = `<span class="t-icon" style="color:${color};display:flex;"><svg class="icon icon-16"><use href="#${icon}"/></svg></span><span>${msg}</span>`;
        $('#toastBox').appendChild(el);
        setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 2600);
    }

    /* ==============================================================
       数字滚动动画
       ============================================================== */
    function animateNum(el, to, duration = 600) {
        const from = parseFloat(el.dataset.v || 0);
        el.dataset.v = to;
        const start = performance.now();
        (function step(now) {
            const p = Math.min((now - start) / duration, 1);
            const e = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(from + (to - from) * e).toLocaleString();
            if (p < 1) requestAnimationFrame(step);
        })(performance.now());
    }

            text:      light ? '#1a2436' : 'rgba(255,255,255,0.95)',
            split:     light ? 'rgba(20,40,80,0.08)'  : 'rgba(255,255,255,0.06)',
            axisLine:  light ? 'rgba(20,40,80,0.18)'  : 'rgba(255,255,255,0.1)',
            tipBg:     light ? 'rgba(255,255,255,0.94)' : 'rgba(15,20,28,0.92)',
            tipText:   light ? '#1a2436' : '#fff',
            tipBorder: light ? 'rgba(40,60,90,0.14)' : 'rgba(255,255,255,0.12)',
            pieBorder: light ? 'rgba(238,242,247,0.9)' : 'rgba(10,14,20,0.35)',
            line:      light ? '#0A84FF' : '#64D2FF',
            areaTop:   light ? 'rgba(10,132,255,0.22)' : 'rgba(100,210,255,0.32)',
            glow:      light ? 'rgba(10,132,255,0.25)' : 'rgba(100,210,255,0.4)',

            barBottom: light ? 'rgba(10,132,255,0.12)' : 'rgba(10,132,255,0.35)'
        };
    }

    function tipStyle() {
        const th = chartTheme();
        return {
            backgroundColor: th.tipBg,
            borderColor: th.tipBorder,
            textStyle: { color: th.tipText, fontSize: 11 },
            extraCssText: 'backdrop-filter:blur(8px);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.28);'
        };
    }

    function axisLabelStyle() {
        return { fontFamily: 'inherit', fontSize: 10, color: chartTheme().label };
    }

    function initCharts() {
        pieChart   = echarts.init($('#chartPie'));
        trendChart = echarts.init($('#chartTrend'));

    // 饼图：设备状态占比（图居左可交互 · 状态信息归纳右侧）
    const pieOff = {}; // 扇区显隐状态（key → true 为隐藏）

    function renderPie(p) {
        const th = chartTheme();
        const d = p.pie;
        const items = [
            ['online', d.online, '#30D158'],
            ['offline', d.offline, theme === 'light' ? '#98A2B3' : '#8E8E93'],
            ['maint', d.maint, '#0A84FF'],
            ['fault', d.fault, '#FF453A']
        ];
        const visible = items.filter(([k]) => !pieOff[k]);
        const vTotal = visible.reduce((s, [, v]) => s + v, 0);

        pieChart.setOption({
            tooltip: { ...tipStyle(), formatter: '{b}: {c} ({d}%)' },
            series: [{
                type: 'pie', radius: '70%', center: ['50%', '50%'],
                label: { show: false }, labelLine: { show: false },
                itemStyle: { borderRadius: 3, borderColor: th.pieBorder, borderWidth: 1.5 },
                emphasis: {
                    scale: true, scaleSize: 6,
                    itemStyle: { shadowBlur: 16, shadowOffsetY: 4, shadowColor: 'rgba(0, 0, 0, 0.35)' }
                },
                animationDurationUpdate: 500,
                data: items.map(([k, v, c]) => ({
                    name: t('p_' + k), value: v, key: k,
                    itemStyle: { color: c, opacity: pieOff[k] ? 0.22 : 1 }
                }))
            }]
        });

        // 右侧状态信息（简约行式：色点 + 名称 + 数量/占比）
        $('#pieLegend').innerHTML = items.map(([k, v, c]) => {
            const off = pieOff[k];
            const pct = off ? '--' : vTotal > 0 ? (v / vTotal * 100).toFixed(1) + '%' : '0%';
            return `<button class="lg-row${off ? ' dimmed' : ''}" data-key="${k}" style="--c:${c}" title="${t('p_toggle')}">
                <span class="lg-dot" style="background:${c}"></span>
                <span class="lg-name">${t('p_' + k)}</span>
                <span class="lg-val"><b>${v.toLocaleString()}</b></span>
            </button>`;
        }).join('');

        const rows = $$('#pieLegend .lg-row');
        const toggle = k => {
            if (!pieOff[k] && visible.length <= 1) { toast(t('toast_pie_min'), 'info'); return; }
            pieOff[k] = !pieOff[k];
            renderPie(p);
        };
        rows.forEach(r => r.addEventListener('click', () => toggle(r.dataset.key)));

        // 饼图 hover → 联动高亮右侧对应卡片
        pieChart.off('mouseover');
        pieChart.off('mouseout');
        pieChart.off('click');
        pieChart.on('mouseover', e => {
            if (!e.data || !e.data.key) return;
            rows.forEach(r => r.classList.toggle('hl', r.dataset.key === e.data.key));
        });
        pieChart.on('mouseout', () => rows.forEach(r => r.classList.remove('hl')));
        pieChart.on('click', e => { if (e.data && e.data.key) toggle(e.data.key); });
    }

    // 曲线图：健康趋势
    function renderTrend(p) {
        const th = chartTheme();
        const data = p.trend[currentRange];
        const xData = currentRange === 'h24'
            ? data.map((_, i) => `${String(i).padStart(2, '0')}:00`)
            : currentRange === 'd7'
                ? (lang === 'zh' ? ['周一','周二','周三','周四','周五','周六','周日'] : ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'])
                : data.map((_, i) => `D${i + 1}`);

        trendChart.setOption({
            tooltip: { ...tipStyle(), trigger: 'axis', valueFormatter: v => v + t('unit_pct') },
            grid: { left: 6, right: 8, top: 14, bottom: 0, containLabel: true },
            xAxis: {
                type: 'category', data: xData, boundaryGap: false,
                axisLine: { lineStyle: { color: th.axisLine } },
                axisTick: { show: false }, axisLabel: { ...axisLabelStyle(), interval: currentRange === 'h24' ? 5 : 'auto' }
            },
            yAxis: {
                type: 'value', min: v => Math.floor(v.min - 2), max: v => Math.ceil(v.max + 1),
                splitLine: { lineStyle: { color: th.split } },
                axisLabel: axisLabelStyle()
            },
            series: [{
                type: 'line', data, smooth: 0.4, symbol: 'none',
                lineStyle: { width: 2, color: th.line, shadowColor: th.glow, shadowBlur: 10 },
                areaStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: th.areaTop },
                        { offset: 1, color: 'rgba(100,210,255,0)' }
                    ])
                },
                animationDurationUpdate: 600
            }]
        });
    }

        $('#maintList').innerHTML = p.maint.map((m, i) => `
            <div class="list-item glass-inline" data-maint="${i}" style="animation-delay:${i * 0.06}s">
                <div class="item-icon tone-${m.tone}"><svg class="icon icon-18"><use href="#i-${m.icon}"/></svg></div>
                <div class="item-content">
                    <h4>${lang === 'zh' ? m.zh : m.en}</h4>
                    <p>${lang === 'zh' ? m.metaZh : m.metaEn}</p>
                </div>
                <svg class="icon icon-14 item-chevron"><use href="#i-chevron"/></svg>
            </div>`).join('');
        $('#maintBadge').textContent = `${p.maint.length} OPEN`;
    }

    /* ==============================================================
       项目切换（全屏联动）
       ============================================================== */
    function switchProject(pid, silent = false, keepInfo = false) {
        currentProject = pid;
        const p = PROJECTS[pid];

        // 项目列表激活状态
        $$('.pl-item').forEach(b => {
            const on = b.dataset.project === pid;
            b.classList.toggle('active', on);
            b.setAttribute('aria-selected', on);
        });

        // 顶部数据源 pill
        $('#currentPillText').textContent = t(p.pillKey);

        // 设备总览（纯数据）
        animateNum($('#statTotal'), p.stats.total);
        animateNum($('#statOnline'), p.stats.online);
        animateNum($('#statAttention'), p.stats.attention);

        // 高德地图：pin 状态 + 视角联动
        syncMap(pid);

        // 图表 + 列表
        renderPie(p);
        renderTrend(p);
        renderBar(p);
        renderLists(p);
        $('#pieSource').textContent = t('seg_' + pid);

        if (!silent) {
            toast(pid === 'global'
                ? t('toast_back')
                : t('toast_switch').replace('{x}', t('seg_' + pid)), 'ok');
        }

        // 非地图 pin 触发的切换 → 关闭信息窗
        if (!keepInfo) closeSpotInfo();
    }

    /* ==============================================================
       高德地图（香港区域 · GIS 背景）
       ============================================================== */
    const AMAP_KEY = '482b385813c3145a2d7cbc16e38c318f';
    const AMAP_SPOTS = {
        global:   { pos: [114.2105, 22.3225], name: 'Kowloon Bay' },
        faihuang: { pos: [114.1220, 22.3700], name: 'Fai Huang' },
        shk:      { pos: [114.1570, 22.2820], name: 'SHK' }
    };
    const AMAP_HOME = { center: [114.1690, 22.3180], zoom: 12 };
    let amapInstance = null;

    function amapStyle() {
        return theme === 'light' ? 'amap://styles/normal' : 'amap://styles/darkblue';
    }

    function initMap() {
        if (!window.AMap || !$('#amapContainer')) return;

        amapInstance = new AMap.Map('amapContainer', {
            center: AMAP_HOME.center,
            zoom: AMAP_HOME.zoom,
            zooms: [10, 18],
            mapStyle: amapStyle(),
            resizeEnable: true,
            features: ['bg', 'road', 'building', 'point']
        });

        // 项目打点（高德 pin 风格 · 点击切换项目 + 弹出信息窗）
        Object.entries(AMAP_SPOTS).forEach(([key, s]) => {
            const marker = new AMap.Marker({
                position: s.pos,
                anchor: 'bottom-center',
                offset: new AMap.Pixel(0, 6),
                content: `
                    <div class="ap-pin" data-project="${key}">
                        <span class="ap-name">${s.name}</span>
                        <span class="ap-head">
                            <span class="ap-ping" style="animation-delay:${key === 'shk' ? '1.2s' : '0s'}"></span>
                            <span class="ap-dot"></span>
                        </span>
                    </div>`
            });
            marker.on('click', () => handlePinClick(key));
            amapInstance.add(marker);
        });

        // DOM 层事件委托 fallback：部分环境合成 click 不触发 AMap marker 事件
        document.addEventListener('click', e => {
            if (!(e.target instanceof Element)) return;
            const pin = e.target.closest('.ap-pin');
            if (pin) { handlePinClick(pin.dataset.project); return; }
            // 点击固定信息面板内部 → 不关闭
            if (e.target.closest('.gis-info-panel')) return;
            // 点击地图区域（非信息卡内容）→ 关闭信息窗
            if (spotInfoKey && e.target.closest('.amap-container, .amap-wrap')
                && Date.now() - infoOpenedAt > 300) {
                closeSpotInfo();
            }
        });

        // 点击地图空白处关闭信息窗（300ms 内忽略，避免 pin 点击冒泡误关）
        amapInstance.on('click', () => {
            if (spotInfoKey && Date.now() - infoOpenedAt > 300) closeSpotInfo();
        });

        syncMap(currentProject, true);
    }

    // pin 信息窗：健康度 + 设备在线情况（固定右侧面板，完整呈现不被遮挡）
    let spotInfoKey = null, infoOpenedAt = 0, lastPinClickAt = 0;

    // pin 点击统一入口（marker 事件 + DOM 委托双通道，300ms 去重）
    function handlePinClick(key) {
        if (!AMAP_SPOTS[key] || Date.now() - lastPinClickAt < 300) return;
        lastPinClickAt = Date.now();
        switchProject(key, false, true); // keepInfo：切项目但保留信息窗
        openSpotInfo(key);
    }

    function spotInfoHTML(key) {
        const p = PROJECTS[key], s = AMAP_SPOTS[key];
        const rate = p.stats.online / p.stats.total * 100;
        const ok = rate >= 98;
        const dot = c => `<span class="dot" style="background:${c};box-shadow:0 0 6px ${c}"></span>`;
        const row = (label, val, cls = '', d = '') =>
            `<div class="row"><span>${d}${label}</span><b class="${cls}">${val}</b></div>`;
        const gray = theme === 'light' ? '#98A2B3' : '#8E8E93';
        return `<div class="ap-info">
            <div class="ap-info-head">
                <b>${s.name}</b>
                <span class="hp ${ok ? 'ok' : 'warn'}">${rate.toFixed(1)}<small>%</small></span>
            </div>
            <div class="health-bar"><i class="${ok ? '' : 'warn'}" style="width:${rate.toFixed(1)}%"></i></div>
            ${row(t('si_health'), rate.toFixed(1) + '%', ok ? 'g' : 'r')}
            <div class="sec-label">${t('si_online_status')}</div>
            ${row(t('st_total'), p.stats.total.toLocaleString(), '', dot('#64D2FF'))}
            ${row(t('p_online'), p.pie.online.toLocaleString(), 'g', dot('#30D158'))}
            ${row(t('p_offline'), p.pie.offline.toLocaleString(), '', dot(gray))}
            ${row(t('p_maint'), p.pie.maint.toLocaleString(), '', dot('#0A84FF'))}
            ${row(t('p_fault'), p.pie.fault.toLocaleString(), 'r', dot('#FF453A'))}
            <div class="ap-info-foot">${t('si_alarms')} ${p.alarms.length} · ${t('si_orders')} ${p.maint.length}</div>
        </div>`;
    }

    function openSpotInfo(key) {
        const panel = $('#gisInfoPanel'), body = $('#gisInfoBody');
        if (!panel || !body || !AMAP_SPOTS[key]) return;
        body.innerHTML = spotInfoHTML(key);
        panel.classList.add('show');
        spotInfoKey = key;
        infoOpenedAt = Date.now();
    }

    function closeSpotInfo() {
        const panel = $('#gisInfoPanel');
        if (panel) panel.classList.remove('show');
        spotInfoKey = null;
    }

    // 项目切换 → pin 高亮/暗化 + 地图视角飞行
    function syncMap(pid, silent = false) {
        if (!amapInstance) return;

        $$('.ap-pin').forEach(el => {
            const key = el.dataset.project;
            el.classList.toggle('active', pid !== 'global' && key === pid);
            el.classList.toggle('dim', pid !== 'global' && key !== pid);
        });

        if (pid === 'global') {
            amapInstance.setZoomAndCenter(AMAP_HOME.zoom, AMAP_HOME.center);
        } else {
            const s = AMAP_SPOTS[pid];
            if (s) amapInstance.setZoomAndCenter(14, s.pos);
        }
        void silent;
    }

    // 异步加载高德 JS API（失败时保留科技网格背景，不影响主功能）
    (function loadAMap() {
        if (window.AMap) { initMap(); return; }
        const s = document.createElement('script');
        s.src = `https://webapi.amap.com/maps?v=1.4.15&key=${AMAP_KEY}`;
        s.onload = () => initMap();
        s.onerror = () => toast('Map failed to load, showing grid view', 'info');
        document.head.appendChild(s);
    })();

    /* ==============================================================
       事件绑定
       ============================================================== */
    // 项目列表点击
    $$('.pl-item').forEach(b => b.addEventListener('click', () => switchProject(b.dataset.project)));

    // 点位信息面板关闭按钮
    $('#infoClose').addEventListener('click', e => {
        e.stopPropagation();
        closeSpotInfo();
    });

    // 周期切换 tabs
    $$('#rangeTabs .tab-btn').forEach(b => b.addEventListener('click', () => {
        $$('#rangeTabs .tab-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        currentRange = b.dataset.range;
        renderTrend(PROJECTS[currentProject]);
        toast(t('toast_range').replace('{x}', b.textContent), 'info');
    }));

    // 左侧导航
    $$('.nav-item').forEach(b => b.addEventListener('click', () => {
        $$('.nav-item').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        toast(t('toast_nav').replace('{x}', b.querySelector('.nav-label').textContent), 'info');
    }));

    // 语言切换
    $('#btnLang').addEventListener('click', () => {
        lang = lang === 'zh' ? 'en' : 'zh';
        document.documentElement.lang = lang === 'zh' ? 'zh-HK' : 'en';
        $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
        $('#langText').textContent = lang === 'zh' ? '中 / EN' : 'EN / 中';
        toast(t('toast_lang'), 'ok');
        if (spotInfoKey) openSpotInfo(spotInfoKey); // 信息窗文案联动（重建）
        switchProject(currentProject, true);
    });

    // 深/浅主题切换
    $('#btnTheme').addEventListener('click', () => {
        theme = theme === 'dark' ? 'light' : 'dark';
        document.body.classList.toggle('light', theme === 'light');
        const use = $('#themeIcon');
        use.setAttribute('href', theme === 'light' ? '#i-sun' : '#i-moon');
        use.setAttribute('xlink:href', theme === 'light' ? '#i-sun' : '#i-moon');
        if (amapInstance) amapInstance.setMapStyle(amapStyle()); // 地图样式联动
        switchProject(currentProject, true); // 图表配色联动刷新
        toast(theme === 'light' ? t('toast_theme_light') : t('toast_theme_dark'), 'info');
    });

    // 用户下拉菜单
    const userBtn = $('#userBtn'), userMenu = $('#userMenu');
    userBtn.addEventListener('click', e => {
        e.stopPropagation();
        const open = userMenu.classList.toggle('open');
        userBtn.classList.toggle('open', open);
        userBtn.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', e => {
        if (!(e.target instanceof Element)) return;
        if (!e.target.closest('.user-wrap')) {
            userMenu.classList.remove('open');
            userBtn.classList.remove('open');
        }
    });
    $$('.menu-item').forEach(b => b.addEventListener('click', () => {
        userMenu.classList.remove('open');
        userBtn.classList.remove('open');
        toast(t('toast_menu_' + b.dataset.menu), b.dataset.menu === 'logout' ? 'warn' : 'info');
    }));

    // 告警 / 工单列表点击（事件委托）
    $('#alarmList').addEventListener('click', e => {
        const item = e.target.closest('[data-alarm]');
        if (!item) return;
        const a = PROJECTS[currentProject].alarms[item.dataset.alarm];
        toast(t('toast_alarm').replace('{x}', lang === 'zh' ? a.zh : a.en), 'alert');
    });
    $('#maintList').addEventListener('click', e => {
        const item = e.target.closest('[data-maint]');
        if (!item) return;
        const m = PROJECTS[currentProject].maint[item.dataset.maint];
        toast(t('toast_maint').replace('{x}', lang === 'zh' ? m.zh : m.en), 'info');
    });

    /* ==============================================================
       自适应 resize
       ============================================================== */
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            [pieChart, trendChart, barChart].forEach(c => c && c.resize());
        }, 120);
    });

    /* ==============================================================
       初始化
       ============================================================== */
    const starfield = new Starfield($('#starfield'));
    document.addEventListener('visibilitychange', () => {
        starfield.running = !document.hidden;
    });

    // 项目列表右侧设备数
    $$('[data-count]').forEach(el => {
        el.textContent = PROJECTS[el.dataset.count].stats.total.toLocaleString();
    });

    initCharts();
    switchProject('global', true);
    </script>

</body>
</html>
